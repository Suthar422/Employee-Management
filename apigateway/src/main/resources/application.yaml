spring:
  application:
    name: api-gateway-server

# this is for tracing and metrics and pass the same trace id and span id to the downstream (calling) services
  reactor:
    context-propagation: auto

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: userinfo-service
              uri: lb://userinfo-service
              predicates:
                - Path=/userinfo/**

            - id: book-seat-service
              uri: lb://book-seat-service
              predicates:
                - Path=/bookseat/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8880/realms/master/protocol/openid-connect/certs"

server:
  port: 8888

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    # Optional: Customize log format to visually verify Trace ID and Span ID inclusions
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

  #exposing actuator all points

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    tags:
      application: ${spring.application.name}



