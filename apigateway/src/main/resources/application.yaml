spring:
  application:
    name: api-gateway-server
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: userinfo-service
              uri: lb://userinfo-service
              predicates:
                - Path=/userinfo/**

            - id: book-seat-service
              uri: lb://book-seat-service
              predicates:
                - Path=/bookseat/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8880/realms/master/protocol/openid-connect/certs"

server:
  port: 8888

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    # Optional: Customize log format to visually verify Trace ID and Span ID inclusions
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"

  #exposing actuator all points

management:
  endpoints:
    web:
      exposure:
        include: "*"


  tracing:
    sampling:
      probability: 1.0 # 1.0 means 100% of requests are traced. Reduce in production (e.g., 0.1)
  metrics:
    export:
      otlp:
        url: http://otel-collector:4318/v1/metrics
  open-telemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces

  # Optional: Customize log format to visually verify Trace ID and Span ID inclusions
  logging:
    pattern:
      level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"



