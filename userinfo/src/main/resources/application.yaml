eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1


resilience4j:
  circuit breaker:
    instances:
      #name of service
      userinfoCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 6
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        automatic-transition-from-open-to-half-open-enabled: true
        permittedNumberOfCallsInHalfOpenState: 3
      #to see the circuit breaker status use actuator  http://localhost:7083/actuator/circuitbreakers
      #we can mention the exceptions that occur then we execute fallback method
        record-exceptions:
          - java.lang.Throwable
          - java.lang.RuntimeException
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException

        ignore-exceptions:
          - java.lang.IllegalArgumentException

management:
  health:
    circuit breakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'

  tracing:
    sampling:
      probability: 1.0 # 1.0 means 100% of requests are traced. Reduce in production (e.g., 0.1)
  metrics:
    export:
      otlp:
        url: http://otel-collector:4318/v1/metrics
  open-telemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector:4318/v1/traces


# Optional: Customize log format to visually verify Trace ID and Span ID inclusions
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"


