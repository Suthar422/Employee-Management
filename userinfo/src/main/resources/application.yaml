server:
  port: 7083

spring:
  application:
    name: userinfo-service

  # this is for tracing and metrics and pass the same trace id and span id to the downstream (calling) services
  reactor:
    context-propagation: auto

  cloud:
    openfeign:
      micrometer:
        enabled: true
#  datasource:
#    url: jdbc:h2:mem:bookseat
#    driverClassName: org.h2.Driver
#    username: user
#    password: ''
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
#      settings:
#        web-allow-others: false
#  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
#    hibernate:
#      ddl-auto: update
#    show-sql: true

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost
    ip-address: 127.0.0.1


resilience4j:
  circuit breaker:
    instances:
      #name of service
      userinfoCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 6
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        automatic-transition-from-open-to-half-open-enabled: true
        permittedNumberOfCallsInHalfOpenState: 3
      #to see the circuit breaker status use actuator  http://localhost:7083/actuator/circuitbreakers
      #we can mention the exceptions that occur then we execute fallback method
        record-exceptions:
          - java.lang.Throwable
          - java.lang.RuntimeException
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException

        ignore-exceptions:
          - java.lang.IllegalArgumentException

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    tags:
      application: ${spring.application.name}


# Optional: Customize log format to visually verify Trace ID and Span ID inclusions
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"


